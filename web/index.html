<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wikidot 搜索</title>
    <base target="_blank">
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
        color: #202124;
      }

      main {
        box-sizing: border-box;
        width: min(100%, 760px);
        min-height: 240px;
        margin: 0 auto;
        padding: 12px;
      }

      .search-box {
        display: flex;
        gap: 8px;
      }

      .search-input {
        box-sizing: border-box;
        flex: 1;
        min-width: 0;
        min-height: 42px;
        padding: 8px 12px;
        border: 1px solid #b8bec8;
        border-radius: 6px;
        font: inherit;
        font-size: 16px;
      }

      .search-input:focus {
        border-color: #356ae6;
        outline: 2px solid #d8e2ff;
        outline-offset: 1px;
      }

      .clear-button {
        min-width: 58px;
        border: 1px solid #b8bec8;
        border-radius: 6px;
        background: #f7f8fa;
        color: #30343b;
        font: inherit;
        cursor: pointer;
      }

      .clear-button:disabled {
        cursor: default;
        opacity: .55;
      }

      .search-status {
        min-height: 24px;
        margin: 8px 0 4px;
        color: #626a76;
        font-size: 14px;
      }

      .search-results {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .search-result {
        padding: 10px 0 12px;
        border-bottom: 1px solid #e7e9ed;
      }

      .result-link {
        color: #1459b8;
        font-size: 17px;
        font-weight: 600;
        text-decoration: none;
      }

      .result-link:hover,
      .result-link:focus {
        text-decoration: underline;
      }

      .result-name {
        margin-left: 8px;
        color: #707782;
        font-size: 13px;
      }

      .result-snippet {
        margin: 4px 0 0;
        color: #454b54;
        font-size: 14px;
        overflow-wrap: anywhere;
      }

      mark {
        padding: 0 1px;
        border-radius: 2px;
        background: #fff0a8;
        color: inherit;
      }

      @media (max-width: 420px) {
        main {
          padding: 8px;
        }

        .result-link {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="search-box">
        <input
          id="search-input"
          class="search-input"
          type="search"
          inputmode="search"
          enterkeyhint="search"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="搜索页面"
          aria-label="搜索页面"
        >
        <button id="clear-button" class="clear-button" type="button" disabled>清除</button>
      </div>
      <p id="search-status" class="search-status" role="status" aria-live="polite">正在加载索引…</p>
      <ol id="search-results" class="search-results" aria-label="搜索结果"></ol>
    </main>
    <script src="./orama/search.js" defer></script>
  </body>
</html>
