<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wikidot 搜索</title>
    <base target="_blank">
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
    </style>
    <link href="./pagefind/pagefind-ui.css" rel="stylesheet">
  </head>
  <body>
    <main>
      <div id="search"></div>
    </main>
    <script src="./pagefind/pagefind-ui.js"></script>
    <script>
      (() => {
        const minHeight = 280;
        const searchRoot = document.getElementById("search");
        const allowedParentOrigins = new Set([
          "http://wymbot.wikidot.com",
          "https://wymbot.wikidot.com"
        ]);
        let lastHeight = 0;
        let scheduled = false;

        function parentOrigin() {
          try {
            const origin = new URL(document.referrer).origin;
            return allowedParentOrigins.has(origin) ? origin : "*";
          } catch {
            return "*";
          }
        }

        function sendHeight() {
          if (window.parent === window) return;
          const height = Math.max(
            minHeight,
            document.documentElement.scrollHeight,
            document.body.scrollHeight
          );
          if (height === lastHeight) return;
          lastHeight = height;
          window.parent.postMessage(
            { type: "wymbot-search-height", height },
            parentOrigin()
          );
        }

        function scheduleHeight() {
          if (scheduled) return;
          scheduled = true;
          requestAnimationFrame(() => {
            scheduled = false;
            sendHeight();
          });
        }

        function externalizeResultLinks() {
          searchRoot.querySelectorAll("a.pagefind-ui__result-link").forEach((link) => {
            link.target = "_blank";
            link.rel = "noopener noreferrer";
          });
        }

        new ResizeObserver(scheduleHeight).observe(document.documentElement);
        new MutationObserver(scheduleHeight).observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true
        });
        new MutationObserver(() => {
          externalizeResultLinks();
          scheduleHeight();
        }).observe(searchRoot, { childList: true, subtree: true });
        searchRoot.addEventListener("click", (event) => {
          const link = event.target instanceof Element
            ? event.target.closest("a.pagefind-ui__result-link")
            : null;
          if (link) {
            link.target = "_blank";
            link.rel = "noopener noreferrer";
          }
        });
        window.addEventListener("load", scheduleHeight);
        window.addEventListener("message", (event) => {
          if (
            event.source === window.parent &&
            event.data?.type === "wymbot-search-request-height"
          ) {
            scheduleHeight();
          }
        });

        new PagefindUI({
          element: "#search",
          showImages: false,
          translations: {
            placeholder: "搜索页面",
            zero_results: "没有找到结果",
            load_more: "加载更多"
          }
        });
        externalizeResultLinks();
        scheduleHeight();
      })();
    </script>
  </body>
</html>
